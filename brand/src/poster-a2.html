<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>andu design poster, print source</title>
<!--
  Source of brand/print/poster-a2.pdf (build: node brand/build.mjs).
  A2 trim (420 × 594 mm) with 3 mm bleed on every side, drawn in the Stitch poster's px (1190 px across the trim,
  1 px = 0.353 mm) and zoomed to real size. Every text element has class "t" so the build can swap it for outlines.
-->
<style>
  @font-face { font-family: Geist; src: url("../../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
  @page { size: 426mm 600mm; margin: 0; }
  html, body { margin: 0; }
  body { font-family: Geist, sans-serif; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  .page { position: relative; width: 426mm; height: 600mm; overflow: hidden; background: #080b12; }
  .art { position: absolute; left: 0; top: 0; width: 1207px; height: 1701px; zoom: 1.333951; } /* 420 mm / 1190 px */
  .trim { position: absolute; left: 8.5px; top: 8.5px; width: 1190px; height: 1683px; }
  .contact { display: flex; align-items: center; gap: 10px; }
  .dot { color: #3a3e47; }
</style>
</head>
<body>

<div class="page">
